<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProofPulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Private life simulation</p>
          <h1>ProofPulse</h1>
        </div>
        <button id="notify-toggle" class="small-button">
          Enable alerts
        </button>
      </header>

      <main>
        <section id="home-screen" class="screen active">
          <div class="section-header">
            <h2>Active Pulses</h2>
            <button id="new-pulse-button" class="primary-button">
              New Pulse
            </button>
          </div>

          <div id="pulse-list" class="pulse-list"></div>
        </section>

        <section id="editor-screen" class="screen">
          <div class="section-header">
            <button id="back-to-home" class="ghost-button">Back</button>
            <h2 id="editor-title">New Pulse</h2>
          </div>

          <form id="pulse-form" class="editor-form">
            <label>
              Pulse name
              <input
                id="pulse-name"
                type="text"
                maxlength="60"
                placeholder="Morning money pulse"
              />
            </label>

            <div class="editor-row">
              <label>
                Mode
                <select id="pulse-mode">
                  <option value="play-now">Play now</option>
                  <option value="daily">Daily</option>
                </select>
              </label>
              <label>
                Status
                <select id="pulse-status">
                  <option value="active">Active</option>
                  <option value="paused">Paused</option>
                </select>
              </label>
            </div>

            <div class="sub-header">
              <h3>Beats</h3>
              <button id="add-beat-button" class="small-button" type="button">
                Add beat
              </button>
            </div>

            <div id="beats-list" class="beats-list"></div>

            <div class="form-actions">
              <button type="submit" class="primary-button">Save Pulse</button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

    <template id="beat-template">
      <div class="beat-card">
        <div class="beat-header">
          <span class="beat-number">Beat</span>
          <button type="button" class="delete-beat mini-button">Remove</button>
        </div>

        <div class="beat-fields">
          <label>
            Sender
            <input class="beat-sender" type="text" maxlength="30" placeholder="Aster" />
          </label>

          <label>
            Primary line
            <input class="beat-primary" type="text" maxlength="90" placeholder="Morning run is done" />
          </label>

          <label>
            Secondary text
            <input class="beat-secondary" type="text" maxlength="120" placeholder="Outside. 7:52" />
          </label>

          <div class="beat-grid">
            <label>
              Delay (minutes)
              <input class="beat-delay" type="number" min="0" max="1440" value="5" />
            </label>

            <label>
              Window
              <select class="beat-window">
                <option value="">Any time</option>
                <option value="morning">Morning</option>
                <option value="afternoon">Afternoon</option>
                <option value="evening">Evening</option>
                <option value="night">Night</option>
              </select>
            </label>
          </div>
        </div>
      </div>
    </template>

    <script src="app.js"></script>
  </body>
</html>
