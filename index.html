<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProofPulse</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Private life simulation</p>
          <h1>ProofPulse</h1>
        </div>
        <button id="notify-toggle" class="small-button">Enable alerts</button>
      </header>

      <main>
        <section id="home-screen" class="screen active">
          <div class="section-header">
            <h2>Pulses</h2>
            <button id="new-pulse-button" class="primary-button">New Pulse</button>
          </div>

          <div id="pulse-list" class="pulse-list"></div>
        </section>

        <section id="editor-screen" class="screen">
          <div class="section-header">
            <button id="back-to-home" class="ghost-button">Back</button>
            <h2 id="editor-title">New Pulse</h2>
          </div>

          <form id="pulse-form" class="editor-form">
            <label>
              Pulse name
              <input
                id="pulse-name"
                type="text"
                maxlength="60"
                placeholder="Morning money pulse"
              />
            </label>

            <label>
              Sender
              <input id="pulse-sender" type="text" maxlength="30" placeholder="Aster" />
            </label>

            <label>
              Primary line
              <input
                id="pulse-primary"
                type="text"
                maxlength="90"
                placeholder="New offer came through."
              />
            </label>

            <label>
              Secondary text
              <input
                id="pulse-secondary"
                type="text"
                maxlength="120"
                placeholder="You already said yes."
              />
            </label>

            <label>
              Mode
              <select id="pulse-mode">
                <option value="play-now">Play now</option>
                <option value="daily">Daily</option>
              </select>
            </label>

            <label id="delay-field">
              Delay (seconds)
              <input id="pulse-delay" type="number" min="0" max="86400" value="30" />
            </label>

            <label id="window-field" hidden>
              Window
              <select id="pulse-window">
                <option value="">Any time</option>
                <option value="morning">Morning</option>
                <option value="afternoon">Afternoon</option>
                <option value="evening">Evening</option>
                <option value="night">Night</option>
              </select>
            </label>

            <div class="form-actions">
              <button type="button" id="preview-button" class="small-button">
                Preview notification
              </button>
              <button type="submit" class="primary-button">Save Pulse</button>
            </div>
          </form>
        </section>
      </main>
    </div>

    <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
